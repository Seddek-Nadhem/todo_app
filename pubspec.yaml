name: todo_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  get_it: ^9.2.1
  path: ^1.9.1
  intl: ^0.20.2
  flutter_localizations:
